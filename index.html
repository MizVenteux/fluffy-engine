<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101114;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    padding: 30px;
}

header {
    text-align: center;
    margin-bottom: 35px;
}

h1 {
    font-size: 38px;
    margin: 0 0 10px;
}

.intro {
    color: #aaaaaa;
    font-size: 18px;
}

h2 {
    font-size: 27px;
    margin: 40px 0 18px;
    border-bottom: 1px solid #333;
    padding-bottom: 10px;
}

.apps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 15px;
}

.card {
    background: #1b1d22;
    border-radius: 10px;
    padding: 18px;
    border: 2px solid transparent;
}

.card:hover,
.card:focus-within {
    border-color: #4da3ff;
    background: #24272e;
}

.name {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 6px;
}

.type {
    color: #999999;
    font-size: 14px;
    margin-bottom: 14px;
}

.download {
    display: inline-block;
    background: #2878d4;
    color: white;
    text-decoration: none;
    padding: 11px 18px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 15px;
}

.download:hover,
.download:focus {
    background: #4da3ff;
    outline: none;
}

.wallpaper {
    background: #1b1d22;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 12px;
    border: 2px solid transparent;
}

.wallpaper:hover,
.wallpaper:focus-within {
    border-color: #4da3ff;
    background: #24272e;
}

.note {
    margin-top: 45px;
    padding: 18px;
    background: #181a1f;
    border-radius: 8px;
    color: #999999;
    text-align: center;
    font-size: 14px;
}

footer {
    text-align: center;
    color: #666666;
    margin-top: 35px;
    font-size: 13px;
}
</style>
</head>

/* ============================================================

   ============================================================ */

const appSections = document.getElementById("appSections");

const categories = [...new Set(apps.map(app => app.category))];

categories.forEach(category => {

    const heading = document.createElement("h2");
    heading.textContent = category;

    appSections.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "apps";

    apps
        .filter(app => app.category === category)
        .forEach(app => {

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <div class="name">${app.name}</div>
                <div class="type">${app.type}</div>
                <a class="download"
                   href="https://drive.google.com/uc?export=download&id=${app.id}"
                   target="_blank">
                   DOWNLOAD
                </a>
            `;

            grid.appendChild(card);
        });

    appSections.appendChild(grid);
});


/* ============================================================
   BUILD WALLPAPER SECTION
   ============================================================ */

const wallpaperContainer = document.getElementById("wallpapers");

wallpapers.forEach(wallpaper => {

    const item = document.createElement("div");
    item.className = "wallpaper";

    item.innerHTML = `
        <div class="name">${wallpaper.name}</div>
        <a class="download"
           href="https://drive.google.com/uc?export=download&id=${wallpaper.id}"
